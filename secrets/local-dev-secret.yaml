# =============================================================================
# LOCAL DUMMY SECRET — Dev Environment
# =============================================================================
# PURPOSE: Local testing ONLY. Contains fake values. Safe to apply locally.
#
# HOW TO USE:
#   kubectl apply -f secrets/local-dev-secret.yaml -n ml-local
#   Then set secretRef.enabled: true in values/values-dev.yaml
#
# ⚠️  NEVER commit real secrets here. This file has dummy values only.
# ⚠️  This file is for local testing. In cloud, AWS Secrets Manager handles this.
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: ml-api-dev-secrets
  namespace: ml-local
  labels:
    environment: dev
    managed-by: local-testing
type: Opaque
stringData:
  # These are DUMMY values for local development only
  DB_PASSWORD: "local-dev-password-123"
  API_KEY: "local-dev-api-key-abc"
  MODEL_ENDPOINT: "http://localhost:5000"
  JWT_SECRET: "local-dev-jwt-secret"
