# =============================================================================
# LOCAL DUMMY SECRET — Staging Environment
# =============================================================================
# PURPOSE: Local testing of staging config ONLY. Contains fake values.
#
# HOW TO USE:
#   kubectl apply -f secrets/local-staging-secret.yaml -n ml-local
#   Then set secretRef.enabled: true in values/values-staging.yaml
#
# ⚠️  NEVER commit real secrets here. This file has dummy values only.
# ⚠️  In real staging on cloud, AWS Secrets Manager + ESO handles this.
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: ml-api-staging-secrets
  namespace: ml-local
  labels:
    environment: staging
    managed-by: local-testing
type: Opaque
stringData:
  # These are DUMMY values for local staging testing only
  DB_PASSWORD: "local-staging-password-456"
  API_KEY: "local-staging-api-key-def"
  MODEL_ENDPOINT: "http://model-service:5000"
  JWT_SECRET: "local-staging-jwt-secret"
