# =============================================================================
# EXTERNAL SECRET — Production (AWS Secrets Manager via ESO)
# =============================================================================
# PURPOSE: This is the REAL production secrets approach.
#          This file does NOT contain any secret values.
#          It tells the External Secrets Operator (ESO) WHERE to fetch secrets from.
#
# HOW IT WORKS:
#   1. Real secrets live in AWS Secrets Manager (e.g. prod/ml-api/secrets)
#   2. ESO reads this file and syncs those secrets into a K8s Secret automatically
#   3. The K8s Secret is named "ml-api-prod-secrets" (same name the chart uses)
#   4. Pods read secrets as env vars — no human ever handles raw values
#
# PREREQUISITES:
#   - External Secrets Operator installed in the cluster
#   - A ClusterSecretStore named "aws-secrets-manager" configured
#   - IAM permissions for the ESO service account to read from Secrets Manager
#
# HOW TO APPLY (on real cloud cluster):
#   kubectl apply -f secrets/external-secret-prod.yaml -n ml-prod
# =============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ml-api-prod-secrets
  namespace: ml-prod
  labels:
    environment: production
    managed-by: external-secrets-operator
spec:
  # How often ESO checks AWS for updated/rotated values
  refreshInterval: 1h

  # The SecretStore that knows how to talk to AWS Secrets Manager
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  # The K8s Secret that ESO will create/update
  target:
    name: ml-api-prod-secrets      # ← matches secretRef.name in values-prod.yaml
    creationPolicy: Owner          # ESO owns this secret (deletes it if ExternalSecret is deleted)

  # Map each AWS secret key to a K8s secret key
  data:
    - secretKey: DB_PASSWORD       # K8s secret key name
      remoteRef:
        key: prod/ml-api/secrets   # AWS Secrets Manager secret name
        property: db_password      # Key inside the AWS secret (JSON key)

    - secretKey: API_KEY
      remoteRef:
        key: prod/ml-api/secrets
        property: api_key

    - secretKey: MODEL_ENDPOINT
      remoteRef:
        key: prod/ml-api/secrets
        property: model_endpoint

    - secretKey: JWT_SECRET
      remoteRef:
        key: prod/ml-api/secrets
        property: jwt_secret
