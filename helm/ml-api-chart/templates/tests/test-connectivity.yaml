apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ml-api-chart.fullname" . }}-test-connection
  labels:
    {{- include "ml-api-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: connectivity-test
      image: curlimages/curl:8.7.1
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          set -e

          BASE_URL="http://{{ include "ml-api-chart.fullname" . }}:{{ .Values.service.port }}"

          echo "=== Helm Chart Connectivity Test ==="
          echo "Target: $BASE_URL"
          echo ""

          # Wait for endpoint to be reachable
          echo "Waiting for API to respond..."
          curl -s --retry 15 --retry-connrefused --retry-delay 1 -o /dev/null "$BASE_URL/health" || true

          # Test 1: Root endpoint returns 200
          echo "[TEST 1] Root endpoint (GET /)"
          RESPONSE=$(curl -s --retry 5 --retry-connrefused --retry-delay 1 -o /dev/null -w "%{http_code}" "$BASE_URL/")
          if [ "$RESPONSE" = "200" ]; then
            echo "  ✓ PASS (HTTP $RESPONSE)"
          else
            echo "  ✗ FAIL (HTTP $RESPONSE, expected 200)"
            exit 1
          fi

          # Test 2: Health probe (GET /health)
          echo "[TEST 2] Health probe (GET /health)"
          RESPONSE=$(curl -s --retry 5 --retry-connrefused --retry-delay 1 -o /dev/null -w "%{http_code}" "$BASE_URL/health")
          if [ "$RESPONSE" = "200" ]; then
            echo "  ✓ PASS (HTTP $RESPONSE)"
          else
            echo "  ✗ FAIL (HTTP $RESPONSE, expected 200)"
            exit 1
          fi

          # Test 3: Readiness probe (GET /ready)
          echo "[TEST 3] Readiness probe (GET /ready)"
          RESPONSE=$(curl -s --retry 5 --retry-connrefused --retry-delay 1 -o /dev/null -w "%{http_code}" "$BASE_URL/ready")
          if [ "$RESPONSE" = "200" ]; then
            echo "  ✓ PASS (HTTP $RESPONSE)"
          else
            echo "  ✗ FAIL (HTTP $RESPONSE, expected 200)"
            exit 1
          fi

          # Test 4: Response body contains expected environment label
          echo "[TEST 4] Environment label in response body"
          BODY=$(curl -s --retry 5 --retry-connrefused --retry-delay 1 "$BASE_URL/")
          if echo "$BODY" | grep "{{ .Values.environment }}" > /dev/null; then
            echo "  ✓ PASS (environment={{ .Values.environment }} found in response)"
          else
            echo "  ✗ FAIL (environment={{ .Values.environment }} not found in: $BODY)"
            exit 1
          fi

          # Test 5: Predict endpoint returns 200
          echo "[TEST 5] Predict endpoint (GET /predict)"
          RESPONSE=$(curl -s --retry 5 --retry-connrefused --retry-delay 1 -o /dev/null -w "%{http_code}" "$BASE_URL/predict?input=test")
          if [ "$RESPONSE" = "200" ]; then
            echo "  ✓ PASS (HTTP $RESPONSE)"
          else
            echo "  ✗ FAIL (HTTP $RESPONSE, expected 200)"
            exit 1
          fi

          echo ""
          echo "=== All tests passed ✓ ==="
